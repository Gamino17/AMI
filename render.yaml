services:
  # ----------------------------------------------------------------------------
  # AMI mock API: REST + página HTML de firma. Stdlib pura, sin pip install.
  # ----------------------------------------------------------------------------
  - type: web
    name: ami-mock-api
    runtime: python
    plan: starter
    buildCommand: ""
    startCommand: "python3 ami_api.py"
    healthCheckPath: /v1/health
    envVars:
      - key: PORT
        value: 8000
      # Secreto: generar con `openssl rand -hex 32` y pegar en el dashboard.
      - key: AMI_API_KEY
        sync: false
      # URL pública del propio servicio (p.ej. https://protocolami.com una vez
      # configurado el custom domain, o https://ami-mock-api.onrender.com mientras
      # no haya dominio propio). Setear manualmente desde el dashboard tras el
      # primer deploy.
      - key: AMI_PUBLIC_URL
        sync: false
      # === Operations v2 · auth de los webhooks /v1/_telco/* ===
      # Generar con `openssl rand -hex 32`. Mismo valor que se configura en
      # Kannel y Asterisk en infra/.env. Si no se setea, los endpoints /v1/_telco/*
      # devuelven 503 (modo "Operations v2 deshabilitado"), que es lo correcto
      # mientras no hay partner conectado.
      - key: AMI_TELCO_INBOUND_KEY
        sync: false
      # === Modo telco ===
      # mock (default) = simula DLR y lifecycle con Timers en memoria. Útil para
      # dev y para mostrar el protocolo sin partner conectado.
      # live = habla a Kannel (SMS) y Asterisk ARI (voz). Activar cuando el partner
      # entregue trunk SMPP + SIP y los servicios de infra/docker-compose estén
      # desplegados en una VM aparte (Render no es buen sitio para Kannel/Asterisk;
      # se despliegan en un VPS con IP pública estable que el partner pueda whitelistear).
      - key: AMI_TELCO_MODE
        value: mock
      # === Kannel (cuando AMI_TELCO_MODE=live) ===
      # URL pública del Kannel sendsms gateway (Render NO, VPS sí). Tras desplegar
      # el stack infra/, apuntar a https://kannel.tuvps.example/cgi-bin/sendsms.
      - key: AMI_KANNEL_SENDSMS_URL
        sync: false
      - key: AMI_KANNEL_USERNAME
        sync: false
      - key: AMI_KANNEL_PASSWORD
        sync: false
      # URL pública absoluta del webhook DLR del propio AMI (Render). P.ej.
      # https://api.protocolami.com/v1/_telco/sms/dlr.
      - key: AMI_KANNEL_DLR_URL
        sync: false
      # === Asterisk ARI (cuando AMI_TELCO_MODE=live) ===
      - key: AMI_ARI_URL
        sync: false
      - key: AMI_ARI_USERNAME
        sync: false
      - key: AMI_ARI_PASSWORD
        sync: false
      - key: AMI_ARI_TRUNK
        value: PJSIP/trunk_partner

      # === Admin: panel KYC + endpoints REST admin ===
      # Generar con `openssl rand -hex 32`. Sin esto el panel KYC y los
      # endpoints /v1/admin/* dan 401.
      - key: AMI_ADMIN_KEY
        sync: false

      # === KYC ===
      # Activa el gate "no contrato sin DNI verificado" en POST /v1/contracts.
      # En staging déjalo a "0" hasta que el equipo de ops esté listo.
      - key: AMI_KYC_REQUIRED
        value: "1"
      # Dónde se escriben las imágenes de DNI. Apunta al disk persistente
      # `ami-data` (montado en /data). El cron de purga RGPD se ocupa de
      # borrar imágenes a los 90 días tras verified / 30 días tras rejected.
      - key: AMI_KYC_IMAGE_DIR
        value: /data/kyc_images
      # Intervalo del daemon de purga (segundos). Default 3600 (1h).
      - key: AMI_KYC_PURGE_INTERVAL_S
        value: "3600"
      # Remitente del SMS de invitación al KYC (alfa-numérico si Kannel
      # lo soporta, sino E.164). Sin Kannel se ignora.
      - key: AMI_KYC_SMS_FROM
        value: "AMI"

      # === Notificaciones por email (SMTP) ===
      # Necesario para que el rep. legal reciba el link del KYC y los
      # mails de verified/rejected. Sin esto, los emails quedan en dev-log
      # (stderr del proceso) — el panel y la API siguen funcionando.
      - key: AMI_SMTP_HOST
        sync: false
      - key: AMI_SMTP_PORT
        value: "587"
      - key: AMI_SMTP_USER
        sync: false
      - key: AMI_SMTP_PASSWORD
        sync: false
      - key: AMI_SMTP_FROM
        sync: false       # ej. "AMI <noreply@parallax-iei.com>"
      - key: AMI_OPS_EMAIL
        sync: false       # bandeja del equipo de ops para nuevos KYCs

      # === Persistencia ===
      # Path de la SQLite. Apunta al disk persistente para sobrevivir reinicios.
      - key: AMI_DB_PATH
        value: /data/ami_state.db
      # Backup automático: snapshot atómico de la SQLite cada N segundos.
      # Default 1h. Los snapshots viven en /data/backups con rotación de N días.
      - key: AMI_BACKUP_INTERVAL_S
        value: "3600"
      - key: AMI_BACKUP_DIR
        value: /data/backups
      - key: AMI_BACKUP_KEEP_DAYS
        value: "7"

      # === Backup offsite a S3 (opt-in) ===
      # Sin AMI_BACKUP_S3_BUCKET el backup vive solo en el disk persistente.
      # Configurando bucket + credenciales, cada snapshot se sube además a S3
      # vía SigV4 (stdlib pura, sin boto3). Compatible con S3-compatible
      # (Backblaze B2, Wasabi, Cloudflare R2) seteando AMI_BACKUP_S3_ENDPOINT.
      # Usar credenciales IAM con permiso s3:PutObject acotado al bucket.
      - key: AMI_BACKUP_S3_BUCKET
        sync: false
      - key: AMI_BACKUP_S3_REGION
        sync: false       # ej. "eu-west-1" (default si vacío)
      - key: AMI_BACKUP_S3_PREFIX
        sync: false       # ej. "ami-backups/" (default si vacío)
      - key: AMI_BACKUP_AWS_ACCESS_KEY_ID
        sync: false
      - key: AMI_BACKUP_AWS_SECRET_ACCESS_KEY
        sync: false
      # Opcional: endpoint custom para S3-compatible (Backblaze B2, Wasabi, R2).
      # Ej. "https://s3.us-west-002.backblazeb2.com". Vacío = AWS S3 real.
      - key: AMI_BACKUP_S3_ENDPOINT
        sync: false

      # === Hardening webhooks (SSRF) ===
      # Lista de hosts a los que SÍ se permite hacer POST de webhook outbound.
      # Quitar 127.0.0.1/localhost en producción. Si vacío, se permite todo
      # menos las IPs privadas/link-local (default seguro).
      - key: AMI_WEBHOOK_ALLOWED_HOSTS
        sync: false
    # Persistent disk: SQLite + KYC images + backups. Render Starter da 1GB
    # por defecto; subir el plan si el volumen crece. La purga RGPD del KYC
    # mantiene el directorio acotado (90 días retention).
    disk:
      name: ami-data
      mountPath: /data
      sizeGB: 1

  # ----------------------------------------------------------------------------
  # AMI MCP server vía HTTP streamable. Permite que cualquier agente conecte
  # remotamente sin instalar nada. Habla con el API por HTTP usando AMI_API_URL.
  # ----------------------------------------------------------------------------
  - type: web
    name: ami-mcp-http
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    # Render inyecta $PORT; lo reexportamos como AMI_MCP_PORT para que ami_mcp.py
    # lo use al hacer bind del transporte streamable-http.
    startCommand: "AMI_MCP_PORT=$PORT python3 ami_mcp.py http"
    envVars:
      - key: AMI_MCP_HOST
        value: 0.0.0.0
      # URL pública del primer servicio. Setear manualmente tras el primer deploy
      # (p.ej. https://protocolami.com con custom domain, o
      # https://ami-mock-api.onrender.com sin él). No usamos fromService porque
      # para servicios web Render expone host público vía HTTPS y resulta más
      # predecible pegar la URL completa que componerla con propiedades internas.
      - key: AMI_API_URL
        sync: false
      # Misma clave que ami-mock-api.
      - key: AMI_API_KEY
        sync: false
