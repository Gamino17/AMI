; ARI (Asterisk REST Interface) — usado por ami_api.LiveTelcoAdapter para
; originar llamadas y colgarlas. La password vive en .env (no commitear).

[general]
enabled = yes
pretty = yes
allowed_origins = *

[${ARI_USERNAME}]
type = user
read_only = no
password = ${ARI_PASSWORD}
password_format = plain
