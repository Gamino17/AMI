; pjsip.conf — Asterisk SIP stack para AMI.
;
; Dos endpoints principales:
;   - trunk_partner: trunk SIP con el operador (lo que el partner te entrega).
;                    Registramos contra su SBC; las llamadas salientes al PSTN
;                    van por aquí; las entrantes al MID llegan por aquí.
;   - dynamic clients: NO los configuramos en este archivo. En modo
;                      bridge-by-API NO mantenemos UAs registrados de los
;                      clientes; cada llamada lleva su callback_sip_uri y
;                      Asterisk hace SIP-out hacia ese URI al vuelo desde el
;                      dialplan (ver extensions.conf).

[global]
type = global
endpoint_identifier_order = ip,username,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0
external_media_address = ${EXTERNAL_IP}
external_signaling_address = ${EXTERNAL_IP}

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/keys/asterisk.crt
priv_key_file = /etc/asterisk/keys/asterisk.key

; ===================== TRUNK PARTNER =====================
[trunk_partner]
type = endpoint
context = from_partner          ; dialplan que ejecuta las MO entrantes
disallow = all
allow = ulaw,alaw,g722,opus
direct_media = no
ice_support = no
dtmf_mode = rfc4733
outbound_auth = trunk_partner_auth
aors = trunk_partner_aor
from_user = ${SIP_TRUNK_USERNAME}
from_domain = ${SIP_TRUNK_HOST}
language = es

[trunk_partner_auth]
type = auth
auth_type = userpass
username = ${SIP_TRUNK_USERNAME}
password = ${SIP_TRUNK_PASSWORD}

[trunk_partner_aor]
type = aor
contact = sip:${SIP_TRUNK_USERNAME}@${SIP_TRUNK_HOST}:${SIP_TRUNK_PORT}
qualify_frequency = 60

[trunk_partner_identify]
type = identify
endpoint = trunk_partner
match = ${SIP_TRUNK_HOST}

[trunk_partner_registration]
type = registration
outbound_auth = trunk_partner_auth
server_uri = sip:${SIP_TRUNK_HOST}:${SIP_TRUNK_PORT}
client_uri = sip:${SIP_TRUNK_USERNAME}@${SIP_TRUNK_HOST}
retry_interval = 30
expiration = 3600
