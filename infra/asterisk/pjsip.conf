; pjsip.conf — Asterisk SIP stack para AMI.
;
; Dos endpoints principales:
;   - trunk_partner: trunk SIP con el operador (lo que el partner te entrega).
;                    Registramos contra su SBC; las llamadas salientes al PSTN
;                    van por aquí; las entrantes al MID llegan por aquí.
;   - dynamic clients: NO los configuramos en este archivo. En modo
;                      bridge-by-API NO mantenemos UAs registrados de los
;                      clientes; cada llamada lleva su callback_sip_uri y
;                      Asterisk hace SIP-out hacia ese URI al vuelo desde el
;                      dialplan (ver extensions.conf).

[global]
type = global
endpoint_identifier_order = ip,username,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0
external_media_address = ${EXTERNAL_IP}
external_signaling_address = ${EXTERNAL_IP}

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/keys/asterisk.crt
priv_key_file = /etc/asterisk/keys/asterisk.key

; ===================== TRUNK PARTNER (IP-based) =====================
;
; Modo IP-based: el partner whitelistea nuestra IP pública (EXTERNAL_IP).
; Nosotros NO hacemos REGISTER ni mandamos credenciales — el partner
; identifica nuestros INVITE por la IP de origen.
;
; Para llamadas SALIENTES: Asterisk manda el INVITE a sip:${SIP_TRUNK_HOST}.
; Para ENTRANTES: el SBC del partner manda INVITE a nuestro 5060 y el
; bloque [trunk_partner_identify] hace match por su IP/host.
;
; Codecs negociados con el partner — en orden de preferencia. Asterisk anuncia
; estos en la SDP del INVITE; el SBC del partner elige uno. Notas:
;   - alaw: G.711 A-law. 64 kbps.
;   - ulaw: G.711 mu-law, USA + LATAM. 64 kbps.
;   - g722: HD voice, 16kHz, 64 kbps. Si ambos extremos lo soportan = audio mejor.
;   - opus: codec moderno (8-48kHz adaptive). Raro en PSTN.
;   - g729: comprime mucho (8 kbps), requiere licencia comercial. Off por defecto.
;
; Si el partner exige un codec específico, dejar solo ese en `allow=` para
; que Asterisk lo imponga (evita transcodificación CPU-intensiva).

[trunk_partner]
type = endpoint
context = from_partner          ; dialplan que ejecuta las MO entrantes
disallow = all
allow = ulaw,alaw,g722,opus     ; ulaw primero (LATAM); descomenta g729 si toca licencia
;allow = g729                   ; descomenta solo con licencia
direct_media = no               ; el RTP pasa SIEMPRE por Asterisk (necesario para bridging y NAT)
ice_support = no                ; servidor a servidor, no necesitamos ICE
rtp_symmetric = yes             ; manda RTP de vuelta al mismo puerto desde el que llega (NAT helper)
force_rport = yes               ; usa el puerto desde el que llegó el SIP, no el que anuncia (NAT helper)
rewrite_contact = yes           ; reescribe el Contact header del UA con la IP real (NAT helper)
dtmf_mode = rfc4733             ; estándar. Alternativas: 'inband' (audio) o 'info' (SIP INFO)
; IP-based: SIN outbound_auth. El partner nos identifica por IP origen.
aors = trunk_partner_aor
from_domain = ${SIP_TRUNK_HOST}
language = es

; ----- SRTP (cifrado de audio) -----
; Si el partner exige SRTP/SDES, descomentar las 3 líneas siguientes:
;media_encryption = sdes          ; ofrece SRTP-SDES en el SDP
;media_encryption_optimistic = yes  ; si el partner no responde con SRTP, cae a RTP en claro
;transport = transport-tls         ; SRTP normalmente requiere SIP por TLS también

; ----- Jitter buffer (opcional, solo si hay problemas de calidad) -----
;use_avpf = no                  ; AVPF: feedback profile, útil con WebRTC, no con PSTN
;use_ptime = yes                ; respetar el ptime negociado por el SBC

[trunk_partner_aor]
type = aor
; Sin user en el contact — IP-based no necesita identificar usuario.
contact = sip:${SIP_TRUNK_HOST}:${SIP_TRUNK_PORT}
qualify_frequency = 60          ; OPTIONS pings para detectar trunk caído

; Match por IP/host: cuando llega un INVITE desde la IP del SBC del partner,
; Asterisk lo asocia al endpoint trunk_partner (sin necesidad de auth).
[trunk_partner_identify]
type = identify
endpoint = trunk_partner
match = ${SIP_TRUNK_HOST}

; ===================== CLIENT_OUTBOUND (bridge-by-API) =====================
;
; Endpoint cliente GENÉRICO usado para hacer Dial a URIs dinámicos en el
; dialplan: `Dial(PJSIP/sip:user@host:port/client_outbound,...)`.
;
; Sin esto, Dial a URIs SIP dinámicos no funciona — Asterisk PJSIP necesita
; un endpoint "template" del que tomar los parámetros de transporte / codec
; / NAT del leg saliente cuando el peer destino no está pre-registrado.
;
; Cada llamada saliente al callback_sip_uri del cliente AMI usa este endpoint.
; Misma matriz de codecs y NAT helpers que trunk_partner, sin auth (cada
; cliente AMI debería tener su propio token a nivel app si quiere autenticar
; — fuera de scope del trunk SIP).

[client_outbound]
type = endpoint
context = from_client_outbound       ; no debería entrar tráfico por aquí
disallow = all
allow = alaw,ulaw,g722,opus          ; mismo orden que trunk_partner
direct_media = no                    ; RTP pasa por Asterisk (necesario para bridging)
ice_support = no
rtp_symmetric = yes                  ; NAT helper
force_rport = yes                    ; NAT helper
rewrite_contact = yes                ; NAT helper
dtmf_mode = rfc4733
language = es
; Si el cliente AMI exige SRTP, descomentar:
;media_encryption = sdes
;media_encryption_optimistic = yes
