; rtp.conf — configuración del transporte RTP de Asterisk.
;
; SIP transporta la SEÑALIZACIÓN (INVITE, 200 OK, BYE) por puerto 5060.
; Pero el AUDIO en sí viaja en paquetes RTP por puertos UDP separados.
; Aquí decimos qué rango de puertos UDP usa Asterisk para esos paquetes.
;
; Por defecto Asterisk usaría 10000-20000 (10.001 puertos). Eso es exceso
; para nuestro caso: limitar a 10000-10100 (100 puertos = ~50 llamadas
; simultáneas, dos legs por llamada) hace el firewall más estrecho y la
; ops más simple. Si en algún momento esperamos más concurrencia, ampliar.
;
; CRÍTICO: el rango aquí declarado tiene que coincidir EXACTAMENTE con
; los puertos expuestos en docker-compose.yml (10000-10100/udp) y con
; los abiertos en el firewall del VPS (UFW). Si no coinciden, las
; llamadas conectan pero NO HAY AUDIO (bug clásico de NAT/RTP).

[general]
rtpstart = 10000
rtpend = 10100

; Tiempo máximo sin recibir paquetes RTP antes de colgar la llamada por
; "media timeout". 60s es razonable. Si el partner pasa por muchos hops
; y a veces hay micro-cortes, subir a 120.
rtptimeout = 60

; Tiempo máximo sin recibir RTP mientras la llamada está en hold (música
; de espera). Más largo que rtptimeout porque puede no haber audio activo.
rtpholdtimeout = 300

; Si Asterisk no recibe RTP durante este tiempo, manda un "keepalive"
; (paquete RTP vacío) para mantener la sesión NAT viva. Útil cuando el
; cliente está detrás de NAT y el binding del router caduca.
rtpkeepalive = 15

; ===================== ICE / STUN / TURN =====================
; Por defecto desactivado — nuestro caso es servidor a servidor con IPs
; públicas conocidas, no peer-to-peer entre clientes detrás de NAT.
; Si en el futuro montamos clientes que pueden estar tras NAT (móviles,
; navegadores), añadir aquí STUN servers públicos.
;
; icesupport = no
;
; stunaddr = stun.l.google.com:19302

; ===================== JITTER BUFFER (en sip.conf endpoint level) =====================
; El jitter buffer se configura por ENDPOINT en pjsip.conf, no aquí.
; Comentado por defecto en nuestro trunk_partner — sólo activarlo si el
; partner reporta jitter/pérdida en el audio que recibimos:
;
; use_ptime = yes
; allow_transport_reuse = no

; ===================== DEBUG =====================
; Para ver paquetes RTP en vivo durante una llamada de prueba:
;   asterisk -rx "rtp set debug on"
; Para verlo solo entre dos IPs concretas:
;   asterisk -rx "rtp set debug ip 1.2.3.4"
