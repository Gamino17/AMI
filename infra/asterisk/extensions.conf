; extensions.conf — dialplan AMI.
;
; Lógica de bridge-by-API:
;   1. ami_api hace POST /ari/channels con appArgs={callback_sip_uri, ami_call_id,…}.
;   2. Asterisk crea un channel saliente al PSTN por trunk_partner; cuando
;      contesta, lo mete en la Stasis app "ami_voice".
;   3. El script Stasis (o el dialplan abajo) hace Dial(PJSIP/<callback_sip_uri>)
;      y bridgea ambos legs.
;   4. En cada cambio de estado (Ringing, Up, Hangup) un hook hace POST a
;      /v1/_telco/calls/{id}/status para que ami_api refleje el estado.
;
; Para entrantes (from_partner): cuando llega una llamada al partner-trunk,
; consultamos primero /v1/_telco/calls/inbound para obtener el inbound_sip_uri
; del MID; si responde 201, hacemos Dial a ese URI; si 409 (sin config),
; colgamos con 486.

[globals]
AMI_API = ${AMI_PUBLIC_URL}
TELCO_KEY = ${AMI_TELCO_INBOUND_KEY}

; ===================== SALIENTES (bridge-by-API) =====================
; Cuando ami_api hace Originate con app=ami_voice y appArgs JSON, Asterisk
; lleva el channel a Stasis. Aquí simulamos el "after-Stasis-handler" en
; dialplan plain. Para Stasis nativo, usar /var/lib/asterisk/scripts/ami_voice.py
; (no incluido aquí; opcional).

[from_internal]
; Esta sección se usa si en lugar de Stasis se prefiere Dial directo desde
; dialplan (más simple, sin AGI). El Originate apunta a una extension de
; este contexto pasando el callback_sip_uri por variable de canal.

exten => bridge,1,NoOp(Bridge to ${CALLBACK_SIP_URI} for ${AMI_CALL_ID})
 same => n,System(curl -s -X POST -H "X-Telco-Key: ${TELCO_KEY}" -H "Content-Type: application/json" -d '{"status":"ringing","telco_ref":"${CHANNEL(name)}"}' "${AMI_API}/v1/_telco/calls/${AMI_CALL_ID}/status")
 same => n,Dial(PJSIP/${CALLBACK_SIP_URI},60,g)
 same => n,System(curl -s -X POST -H "X-Telco-Key: ${TELCO_KEY}" -H "Content-Type: application/json" -d '{"status":"completed","hangup_cause":"${HANGUPCAUSE}"}' "${AMI_API}/v1/_telco/calls/${AMI_CALL_ID}/status")
 same => n,Hangup()

; Notificar "in_progress" cuando el bridge se establece
exten => h,1,System(curl -s -X POST -H "X-Telco-Key: ${TELCO_KEY}" -H "Content-Type: application/json" -d '{"status":"completed","hangup_cause":"${HANGUPCAUSE}"}' "${AMI_API}/v1/_telco/calls/${AMI_CALL_ID}/status")

; ===================== ENTRANTES =====================
[from_partner]
; Cuando una llamada entra desde el trunk del partner, consultamos AMI para
; saber a dónde reenviar. Se espera body JSON {from, to, telco_ref} y AMI
; responde {forward_sip_uri, call_id, mid} en 201, o 409 si no hay endpoint
; configurado para ese MID.

exten => _X.,1,NoOp(Inbound call from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(JSON_BODY={"from":"${CALLERID(num)}","to":"${EXTEN}","telco_ref":"${CHANNEL(name)}"})
 same => n,Set(FORWARD=${SHELL(curl -s -X POST -H "X-Telco-Key: ${TELCO_KEY}" -H "Content-Type: application/json" -d '${JSON_BODY}' "${AMI_API}/v1/_telco/calls/inbound" | jq -r '.forward_sip_uri // empty')})
 same => n,GotoIf($["${FORWARD}" = ""]?reject:forward)
 same => n(forward),Set(CALL_ID=${SHELL(curl -s -X POST -H "X-Telco-Key: ${TELCO_KEY}" -H "Content-Type: application/json" -d '${JSON_BODY}' "${AMI_API}/v1/_telco/calls/inbound" | jq -r '.call_id')})
 same => n,System(curl -s -X POST -H "X-Telco-Key: ${TELCO_KEY}" -H "Content-Type: application/json" -d '{"status":"ringing"}' "${AMI_API}/v1/_telco/calls/${CALL_ID}/status")
 same => n,Dial(PJSIP/${FORWARD},60,g)
 same => n,System(curl -s -X POST -H "X-Telco-Key: ${TELCO_KEY}" -H "Content-Type: application/json" -d '{"status":"completed","hangup_cause":"${HANGUPCAUSE}"}' "${AMI_API}/v1/_telco/calls/${CALL_ID}/status")
 same => n,Hangup()
 same => n(reject),Hangup(21)   ; 21 = call rejected
