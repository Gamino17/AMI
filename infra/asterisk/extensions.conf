; extensions.conf — dialplan AMI (bridge-by-API).
;
; Modelo: AMI nunca mantiene UAs registrados de los clientes finales. Cada
; llamada lleva su callback_sip_uri y Asterisk hace SIP-out hacia ese URI
; al vuelo. La sintaxis correcta para Dial a URI dinámico es:
;
;     Dial(PJSIP/<URI>/<endpoint_template>)
;
; donde <endpoint_template> es un endpoint cliente genérico ([client_outbound]
; en pjsip.conf) del que Asterisk toma codecs / NAT / transport.
;
; Flujo SALIENTE:
;   1. ami_api hace ARI Originate con app=ami_voice y appArgs JSON.
;   2. Asterisk lleva el channel a Stasis. El script /var/lib/asterisk/scripts/
;      ami_voice.py extrae callback_sip_uri y ami_call_id, hace ContinueInDialplan
;      hacia from_internal,bridge,1 con esas vars seteadas.
;   3. El bridge hace Dial(PJSIP/<URI>/client_outbound).
;
; Flujo ENTRANTE:
;   1. Una llamada entra desde trunk_partner al contexto from_partner.
;   2. UNA SOLA llamada curl a AMI con la info del INVITE. AMI devuelve
;      {forward_sip_uri, call_id, mid} o un error (409 sin endpoint).
;   3. Si hay forward_sip_uri, Dial a él con client_outbound como template.

[globals]
AMI_API = ${AMI_PUBLIC_URL}
TELCO_KEY = ${AMI_TELCO_INBOUND_KEY}

; ===================== SALIENTES (bridge-by-API) =====================
;
; El handler Stasis (ami_voice.py) hace `ContinueInDialplan(from_internal,
; bridge, 1)` con vars CALLBACK_SIP_URI y AMI_CALL_ID seteadas en el channel.

[from_internal]

exten => bridge,1,NoOp(Bridge to ${CALLBACK_SIP_URI} for ${AMI_CALL_ID})
 same => n,Set(STATUS_URL=${AMI_API}/v1/_telco/calls/${AMI_CALL_ID}/status)
 same => n,System(curl -s -X POST -H "X-Telco-Key: ${TELCO_KEY}" -H "Content-Type: application/json" -d '{"status":"ringing","telco_ref":"${CHANNEL(name)}"}' "${STATUS_URL}")
 same => n,Dial(PJSIP/${CALLBACK_SIP_URI}/client_outbound,60,g)
 same => n,Set(HANGUP_BODY={"status":"completed","hangup_cause":"${HANGUPCAUSE}","dial_status":"${DIALSTATUS}"})
 same => n,System(curl -s -X POST -H "X-Telco-Key: ${TELCO_KEY}" -H "Content-Type: application/json" -d '${HANGUP_BODY}' "${STATUS_URL}")
 same => n,Hangup()

; Hangup handler: si el leg origen cuelga antes del bridge, también notifica.
exten => h,1,NoOp(Hangup ${HANGUPCAUSE} for ${AMI_CALL_ID})
 same => n,GotoIf($["${AMI_CALL_ID}" = ""]?end)
 same => n,System(curl -s -X POST -H "X-Telco-Key: ${TELCO_KEY}" -H "Content-Type: application/json" -d '{"status":"completed","hangup_cause":"${HANGUPCAUSE}"}' "${AMI_API}/v1/_telco/calls/${AMI_CALL_ID}/status")
 same => n(end),NoOp(done)

; Inválido tag al que apunta el outbound: cualquier llamada que entre por aquí
; (en teoría no debería) se rechaza. Evita loops si client_outbound contesta
; con re-INVITE inesperado.
[from_client_outbound]
exten => _X.,1,NoOp(Unexpected inbound on client_outbound from ${CALLERID(num)})
 same => n,Hangup(21)

; ===================== ENTRANTES =====================
;
; Una sola petición HTTP devuelve {forward_sip_uri, call_id, mid}. Si AMI
; responde 409 (sin endpoint configurado para ese DDI), colgamos con 486.
;
; Usamos /var/lib/asterisk/scripts/ami_inbound.sh como wrapper en lugar de
; SHELL+curl+jq inline — más fácil de testear y depender solo de bash/curl
; en la imagen (jq NO viene en andrius/asterisk:20.5.2). El script imprime
; "FORWARD=...|CALL_ID=...|MID=..." en una sola línea parseable.

[from_partner]

; Algunos SBC mandan el INVITE con Request-URI `sip:s@<host>` (extensión
; literal `s`) y ponen el DID real en el header To. La extensión `s` extrae
; el número del To header y reenvía al patrón numérico para que el lookup
; AMI ocurra con el DID correcto.
exten => s,1,NoOp(Inbound on `s` from ${CALLERID(num)}, extracting DID from To header)
 same => n,Set(TO_HDR=${PJSIP_HEADER(read,To)})
 same => n,Set(DID_RAW=${CUT(TO_HDR,@,1)})
 same => n,Set(DID=${FILTER(0-9+,${DID_RAW})})
 same => n,GotoIf($["${DID}" = ""]?:hasdid)
 same => n,NoOp(No DID in To header — rejecting)
 same => n,Hangup(21)
 same => n(hasdid),NoOp(Resolved DID: ${DID})
 same => n,Goto(from_partner,${DID},1)

exten => _X.,1,NoOp(Inbound call from ${CALLERID(num)} to ${EXTEN} via ${CHANNEL(name)})
 same => n,Set(LOOKUP=${SHELL(/var/lib/asterisk/scripts/ami_inbound.sh "${CALLERID(num)}" "${EXTEN}" "${CHANNEL(name)}" "${AMI_API}" "${TELCO_KEY}")})
 ; LOOKUP format: "FORWARD=sip:user@host:port|CALL_ID=call_xxx|MID=mid_xxx"
 ; Si el script falla / 409, devuelve "FORWARD=|CALL_ID=|MID=". CUT no se
 ; puede anidar, así que extraemos cada campo en dos pasos.
 same => n,Set(FWD_FIELD=${CUT(LOOKUP,|,1)})
 ; CUT con `2-` toma del campo 2 en adelante (los reune con `=`). Necesario
 ; porque el URI puede contener `=` (ej. `;transport=tls`), no solo el del
 ; FORWARD=. Si usásemos `2`, perdemos todo lo que viene tras el segundo `=`.
 same => n,Set(FORWARD=${CUT(FWD_FIELD,=,2-)})
 same => n,Set(CID_FIELD=${CUT(LOOKUP,|,2)})
 same => n,Set(CALL_ID=${CUT(CID_FIELD,=,2-)})
 same => n,GotoIf($["${FORWARD}" = ""]?reject:forward)
 same => n(forward),NoOp(Forward to ${FORWARD} call_id=${CALL_ID})
 same => n,Set(STATUS_URL=${AMI_API}/v1/_telco/calls/${CALL_ID}/status)
 same => n,System(curl -s -X POST -H "X-Telco-Key: ${TELCO_KEY}" -H "Content-Type: application/json" -d '{"status":"ringing"}' "${STATUS_URL}")
 ; Detecta el caso OpenAI Realtime: si el FORWARD apunta a sip.api.openai.com
 ; usamos el endpoint estático openai_realtime con el project_id como user.
 ; PJSIP no parsea bien Dial(PJSIP/<URI con ;transport=tls>/<endpoint>),
 ; pero sí entiende Dial(PJSIP/<user>@<endpoint>) trivialmente.
 same => n,Set(IS_OPENAI=${REGEX("sip\.api\.openai\.com" ${FORWARD})})
 same => n,GotoIf($["${IS_OPENAI}" = "1"]?openai:standard)
 same => n(openai),NoOp(Routing to OpenAI Realtime via static endpoint)
 ; Extrae el user del URI: "sip:proj_xxx@..." → "proj_xxx"
 same => n,Set(OPENAI_USER=${CUT(CUT(FORWARD,@,1),:,2)})
 same => n,Dial(PJSIP/${OPENAI_USER}@openai_realtime,60,g)
 same => n,Goto(post_dial)
 same => n(standard),NoOp(Routing to generic SIP via client_outbound)
 same => n,Dial(PJSIP/${FORWARD}/client_outbound,60,g)
 same => n(post_dial),System(curl -s -X POST -H "X-Telco-Key: ${TELCO_KEY}" -H "Content-Type: application/json" -d '{"status":"completed","hangup_cause":"${HANGUPCAUSE}","dial_status":"${DIALSTATUS}"}' "${STATUS_URL}")
 same => n,Hangup()
 same => n(reject),NoOp(No endpoint configured for ${EXTEN}, rejecting)
 same => n,Hangup(21)         ; 21 = call rejected (no SIP forward)
