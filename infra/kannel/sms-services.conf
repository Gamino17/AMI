# SMS-services: catch-all que reenvía cualquier MO al webhook AMI.
#
# Kannel hace GET sustituyendo:
#   %p = sender (E.164)        — el "from" real
#   %P = receiver (E.164)      — nuestro MSISDN (a qué número se envió)
#   %a = mensaje crudo
#   %i = SMSC id
#   %t = timestamp
#
# AMI espera JSON, no query string. Por eso usamos `post-url` con
# `text-content-type` JSON, que Kannel también soporta.

group = sms-service
name = ami_inbound
keyword = default
catch-all = true
post-url = "${AMI_PUBLIC_URL}/v1/_telco/sms/inbound"
text-content-type = application/json
text = "{\"from\":\"%p\",\"to\":\"%P\",\"body\":\"%a\",\"telco_ref\":\"kannel:%i\"}"
post-xml-headers = "X-Telco-Key: ${AMI_TELCO_INBOUND_KEY}"
accept-x-kannel-headers = true
max-messages = 0
omit-empty = true
