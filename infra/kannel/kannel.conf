# Kannel bearerbox + smsbox + sendsms — config base para AMI.
#
# Las variables ${...} las sustituye envsubst en el entrypoint, o se reemplazan
# manualmente antes del primer despliegue. El partner telco te entrega:
#   SMPP_HOST, SMPP_PORT, SMPP_SYSTEM_ID, SMPP_PASSWORD, SMPP_SYSTEM_TYPE
# (opcionalmente además TON/NPI específicos y throttling).

group = core
admin-port = 13000
admin-password = adminpw
status-password = statuspw
smsbox-port = 13001
log-file = "/var/log/kannel/bearerbox.log"
log-level = 1

# ====================== SMPP TRUNK CON EL PARTNER ======================
# Esto es lo único que el partner necesita activar en su lado para que el
# tráfico empiece. Pide BIND_TRANSCEIVER (envío + recepción + DLR en un solo
# socket). Si tu partner requiere BIND_TRANSMITTER/RECEIVER separados, hay
# que duplicar este bloque con `transceiver-mode = false`.
group = smsc
smsc = smpp
smsc-id = partner_smpp
host = "${SMPP_HOST}"
port = ${SMPP_PORT}
smsc-username = "${SMPP_SYSTEM_ID}"
smsc-password = "${SMPP_PASSWORD}"
system-type = "${SMPP_SYSTEM_TYPE}"
transceiver-mode = true
source-addr-ton = ${SMPP_SOURCE_TON}
source-addr-npi = ${SMPP_SOURCE_NPI}
# Asegurar que los DLRs vienen a este SMSC
enquire-link-interval = 30
reconnect-delay = 10
keepalive = 60

# ====================== SMSBOX ======================
group = smsbox
bearerbox-host = 127.0.0.1
sendsms-port = 13013
log-file = "/var/log/kannel/smsbox.log"
log-level = 1

# Cuenta HTTP que ami_api usa para enviar (params username/password en
# /cgi-bin/sendsms). Cambiar el password en .env.
group = sendsms-user
username = "${KANNEL_SENDSMS_USER}"
password = "${KANNEL_SENDSMS_PASSWORD}"
default-smsc = partner_smpp
# Aceptar UCS-2 (coding=2) para soportar emoji y caracteres no-GSM.

# ====================== DLR ROUTING ======================
# DLR storage en memoria (suficiente para v1). Si vamos a varios procesos
# o necesitamos persistencia, cambiar a `dlr-storage = mysql|spool`.
group = core
dlr-storage = internal

# ====================== INBOUND ROUTING ======================
# Cuando un MO (mobile-originated) entrante llega del SMSC, Kannel busca un
# sms-service que case por keyword/regex en /etc/kannel/sms-services.conf
# (incluido más abajo). Allí definimos un único service catch-all que hace
# POST al webhook /v1/_telco/sms/inbound del backend AMI.
include "/etc/kannel/sms-services.conf"
